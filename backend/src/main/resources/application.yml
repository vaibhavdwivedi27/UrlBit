spring:
  application:
    name: urlbit
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlbit}
    username: ${DB_USERNAME:urlbit}
    password: ${DB_PASSWORD:urlbit_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 250ms
      lettuce:
        shutdown-timeout: 200ms

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: urlbit
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [requestId=%X{requestId}] %logger{36} - %msg%n"

urlbit:
  base-url: ${BASE_URL:https://urlbit.in}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 2592000
    issuer: urlbit.in
  cache:
    link-ttl: 3600s
    negative-ttl: 30s
  rate-limit:
    create:
      authenticated-limit: 30
      authenticated-window: 60s
      guest-limit: 30
      guest-window: 60s
    login:
      limit: 10
      window: 300s
  analytics:
    queue-capacity: 10000
    flush-interval-ms: 1000
    batch-size: 1000

