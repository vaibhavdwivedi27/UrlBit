services:
  postgres:
    image: postgres:16-alpine
    container_name: urlbit-postgres
    env_file:
      - .env.example
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - urlbit-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urlbit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urlbit-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  urlbit-pg-data:
